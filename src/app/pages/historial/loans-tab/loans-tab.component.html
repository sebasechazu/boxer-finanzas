<app-loans-list [loans]="loanPlanService.userLoanPlans()" (edit)="editLoan($event)" (delete)="deleteLoan($event)"/>

<app-loan-modal [isOpen]="isModalOpen" [isSaving]="isSaving" [editingLoanId]="editingLoanId"
  [initialData]="initialLoanData" (dismiss)="closeModal()" (save)="onSaveLoan($event)"/>

<ion-fab slot="fixed" vertical="bottom" horizontal="end">
  <ion-fab-button (click)="openAddModal()">
    <ion-icon name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>
