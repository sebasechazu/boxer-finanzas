@if (articles().length > 0) {
<ion-list>
  @for (article of articles(); track article.id) {

  <ion-item-sliding>

    <ion-item-options side="start">
      <ion-item-option  color="danger" (click)="delete.emit(article.id)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>

    <ion-item>
      <ion-label>
        <h2>{{ article.nombre }}</h2>
        
      </ion-label>
      <ion-note slot="end">{{ article.precioVentaContado }}</ion-note>
    </ion-item>

    <ion-item-options side="end" >
      <ion-item-option (click)="edit.emit(article)" color="primary">
        <ion-icon name="create-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>

  </ion-item-sliding>
  } 
</ion-list>
} @else {
  <ion-card>
    <ion-card-header>
      <ion-card-title>No hay artículos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Agrega artículos para llevar un mejor control de tus operaciones.
    </ion-card-content>
  </ion-card>
}
