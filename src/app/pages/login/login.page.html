<ion-content class="ion-text-center login-content">
  
  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  @if (isCheckingAuth()) {
    <div class="auth-loading-overlay">
      <div class="logo-checking animate-beat">
        <ion-img src="assets/icon/logo.png" alt="Boxer Logo"></ion-img>
      </div>
      <p class="checking-text">Reconectando...</p>
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>
  } @else {
    <ion-grid style="height: 100%; position: relative; z-index: 1;">
      <ion-row class="ion-align-items-center ion-justify-content-center" style="height: 100%;">
        <ion-col size="12" size-sm="10" size-md="8" size-lg="6" size-xl="4" style="max-width: 380px;">
          <ion-card mode="ios" class="glass-card">
            <ion-card-header class="ion-margin-top ion-margin-bottom">
              <ion-card-title class="brand-title">Boxer Finanzas</ion-card-title>
              <ion-card-subtitle class="brand-subtitle">Finanzas simples y modernas</ion-card-subtitle>
            </ion-card-header>
            
            <ion-card-content>
              @if (isLoading()) {
                <div class="auth-spinner-container ion-margin-bottom">
                  <ion-spinner name="crescent" color="primary"></ion-spinner>
                  <p class="auth-spinner-text">Autenticando...</p>
                </div>
              } @else {
                <form class="auth-form" (ngSubmit)="submitEmailAuth()">
                  <ion-item class="auth-input" lines="none">
                    <ion-label position="stacked">Correo</ion-label>
                    <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
                  </ion-item>

                  <ion-item class="auth-input" lines="none">
                    <ion-label position="stacked">Contraseña</ion-label>
                    <ion-input type="password" [(ngModel)]="password" name="password"></ion-input>
                  </ion-item>

                  <ion-button class="auth-submit" expand="block" color="primary" type="submit">
                    Iniciar sesión
                  </ion-button>

                  <ion-button class="auth-link" fill="clear" expand="block" (click)="goToRegister()">
                    ¿No tienes cuenta? Regístrate
                  </ion-button>

                  <div class="divider">o</div>

                  <button class="google-btn" (click)="loginWithGoogle()" type="button">
                    <div class="google-icon-wrapper">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="google-icon-svg">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22-.03-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                      </svg>
                    </div>
                    <span class="google-btn-text">Continuar con Google</span>
                  </button>
                </form>
              }
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  }

</ion-content>
