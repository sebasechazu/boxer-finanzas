<ion-header translucent>
  <ion-toolbar>
    <app-notification-bell slot="start"></app-notification-bell>
    <ion-title class="text-gradient">{{ nombreNegocioActivo() }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (tieneMultiplesCuentas()) {
  <div class="account-switcher">
    <p>Viendo cuenta de:</p>
    <div>
      @for (cuenta of accountService.cuentasAccesibles(); track cuenta.propietarioUid) {
      <ion-chip [color]="accountService.effectiveAccountUid() === cuenta.propietarioUid ? 'primary' : 'medium'"
        [outline]="accountService.effectiveAccountUid() !== cuenta.propietarioUid" (click)="switchAccount(cuenta)">
        <ion-icon [name]="cuenta.esPropia ? 'person-outline' : 'business-outline'" slot="start"></ion-icon>
        <ion-label>
          @if (cuenta.esPropia) {
          Mi cuenta
          } @else {
          {{ getNombreNegocio(cuenta.propietarioUid) }}
          }
        </ion-label>
      </ion-chip>
      }
    </div>
  </div>
  }

  <app-dashboard-cards [totalPaid]="operationService.totalPaid()" [moneyOnTheStreet]="operationService.moneyOnTheStreet()"
    [collectedToday]="operationService.collectedToday()"
    [pendingCollectionsToday]="operationService.pendingCollectionsToday()">
  </app-dashboard-cards>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Próximos Vencimientos</ion-card-title>
    </ion-card-header>
    <ion-card-content style="display: flex; justify-content: center;">
      <ion-datetime presentation="date" [highlightedDates]="highlightedDates()" (ionChange)="onDateChange($event)"></ion-datetime>
    </ion-card-content>
  </ion-card>

  <app-vencimientos-modal
    [isOpen]="isModalOpen()"
    [selectedDate]="selectedDate()"
    [cuotas]="cuotasDelDia()"
    (dismiss)="onModalDismiss()"
    (pay)="payInstallment($event)"
    (viewAll)="goToOperations()">
  </app-vencimientos-modal>

</ion-content>
